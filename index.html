<!-- file: index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Học Tiếng Anh Trọng Vũ</title>
</head>
<body>
    <!-- Khung chứa video YouTube -->
    <div id="player"></div>
    
    <input type="text" id="youtubeLink" placeholder="Dán link YouTube vào đây">
    <button onclick="processVideo()">Phân tích & Tải dữ liệu</button>
    
    <!-- Khung chứa phụ đề như trong ảnh -->
    <div id="transcript-container"></div>

    <script>
        // 1. Nhúng YouTube IFrame API để điều khiển video
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                videoId: '', // Sẽ load khi dán link
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 2. Hàm xử lý khi mày bấm nút kéo link
        async function processVideo() {
            const link = document.getElementById('youtubeLink').value;
            // Tách ID video từ link (code đơn giản hóa)
            const videoId = link.split('v=')[1].substring(0, 11);
            
            player.loadVideoById(videoId);

            // Gọi thằng đệ Vercel lấy data pre-processed
            // Thay bằng link Vercel thật của mày sau khi deploy
            const vercelApiUrl = `https://ten-du-an-vercel-cua-may.vercel.app/api/process-video?id=${videoId}`;
            
            document.getElementById('transcript-container').innerText = "Đang xử lý toàn bộ video... Vui lòng đợi...";

            const response = await fetch(vercelApiUrl);
            const data = await response.json();

            // LƯU VÀO BỘ NHỚ LOCAL THAY VÌ GỌI LẠI
            localStorage.setItem(`video_data_${videoId}`, JSON.stringify(data));
            
            renderTranscript(data);
        }

        // 3. Hiển thị ra màn hình giống giao diện mày muốn
        function renderTranscript(data) {
            const container = document.getElementById('transcript-container');
            container.innerHTML = '';
            
            data.forEach(line => {
                const p = document.createElement('p');
                p.innerHTML = `
                    <strong>${line.text}</strong><br>
                    <span style="color: gray">${line.ipa}</span><br>
                    <span style="color: blue">${line.vi_translation}</span>
                `;
                // Bấm vào câu nào video nhảy đến đó như trong[cite: 3, 4]
                p.onclick = () => player.seekTo(line.offset / 1000, true);
                container.appendChild(p);
            });
        }

        // 4. Theo dõi thời gian thực để highlight câu (0 trễ)
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                setInterval(() => {
                    const currentTime = player.getCurrentTime() * 1000;
                    // Chỗ này mày sẽ viết logic đối chiếu currentTime với line.offset 
                    // trong localStorage để bôi đen text giống trong video nhé.
                }, 100);
            }
        }
    </script>
</body>
</html>
