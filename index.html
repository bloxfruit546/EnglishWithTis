  <!-- ==================== LOGIC JAVASCRIPT ĐỒNG BỘ THỜI GIAN THỰC ==================== -->
  <script>
    // Kho từ điển IPA phong phú
    const dictionary = {
      "it": { ipa: "/ɪt/", vi: "nó, điều đó" },
      "was": { ipa: "/wɒz/", vi: "đã là, thì" },
      "really": { ipa: "/ˈrɪəli/", vi: "thực sự, rất" },
      "nice": { ipa: "/naɪs/", vi: "tuyệt vời, hay" },
      "had": { ipa: "/hæd/", vi: "đã có, đã ăn" },
      "a": { ipa: "/ə/", vi: "một" },
      "lot": { ipa: "/lɒt/", vi: "nhiều" },
      "of": { ipa: "/əv/", vi: "của" },
      "sides": { ipa: "/ˈsaɪdz/", vi: "món phụ, món ăn kèm" },
      "but": { ipa: "/bʌt/", vi: "nhưng" },
      "i": { ipa: "/aɪ/", vi: "tôi" },
      "dont": { ipa: "/doʊnt/", vi: "không" },
      "don't": { ipa: "/doʊnt/", vi: "không" },
      "eat": { ipa: "/iːt/", vi: "ăn" },
      "meat": { ipa: "/miːt/", vi: "thịt" },
      "that": { ipa: "/ðæt/", vi: "điều đó, cái kia" },
      "looks": { ipa: "/lʊks/", vi: "trông có vẻ" },
      "incredible": { ipa: "/ɪnˈkrɛdəbəl/", vi: "tuyệt vời, không thể tin được" },
      "so": { ipa: "/soʊ/", vi: "vì vậy, vậy thì" },
      "thank": { ipa: "/θæŋk/", vi: "cảm ơn" },
      "you": { ipa: "/juː/", vi: "bạn, anh" },
      "ive": { ipa: "/aɪv/", vi: "tôi đã" },
      "i've": { ipa: "/aɪv/", vi: "tôi đã" },
      "been": { ipa: "/bɪn/", vi: "từng, đã đang" },
      "meaning": { ipa: "/ˈmiːnɪŋ/", vi: "dự định, có ý định" },
      "to": { ipa: "/tuː/", vi: "để, tới" },
      "ask": { ipa: "/æsk/", vi: "hỏi" },
      "did": { ipa: "/dɪd/", vi: "đã" },
      "learn": { ipa: "/lɜːrn/", vi: "học" },
      "how": { ipa: "/haʊ/", vi: "làm sao, thế nào" },
      "cook": { ipa: "/kʊk/", vi: "nấu ăn" },
      "while": { ipa: "/waɪl/", vi: "trong khi" },
      "were": { ipa: "/wɜːr/", vi: "đã ở" },
      "in": { ipa: "/ɪn/", vi: "trong" },
      "prison": { ipa: "/ˈprɪzən/", vi: "nhà tù, trại giam" },
      "know": { ipa: "/noʊ/", vi: "biết" },
      "she": { ipa: "/ʃiː/", vi: "cô ấy" },
      "for": { ipa: "/fɔːr/", vi: "trong khoảng" },
      "10": { ipa: "/tɛn/", vi: "mười" },
      "years": { ipa: "/jɪərz/", vi: "năm" },
      "before": { ipa: "/bɪˈfɔːr/", vi: "trước khi" },
      "came": { ipa: "/keɪm/", vi: "đến" },
      "work": { ipa: "/wɜːrk/", vi: "làm việc" },
      "us": { ipa: "/ʌs/", vi: "chúng tôi" }
    };

    function getAutoIPA(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (dictionary[clean]) return dictionary[clean].ipa;
      let ipa = clean
        .replace(/tion/g, 'ʃən')
        .replace(/sh/g, 'ʃ')
        .replace(/ch/g, 'tʃ')
        .replace(/th/g, 'θ')
        .replace(/ph/g, 'f')
        .replace(/ee/g, 'iː')
        .replace(/oo/g, 'uː')
        .replace(/ea/g, 'iː')
        .replace(/ai/g, 'eɪ')
        .replace(/ay/g, 'eɪ')
        .replace(/igh/g, 'aɪ');
      return `/${ipa}/`;
    }

    // Video mẫu đã được nạp sẵn 18 câu chuẩn xác
    const videoPresets = [
      {
        videoId: "LpUh8nUzRL8",
        title: 'After Life - "I\'m Lisa" Scene #AfterLife',
        sentences: [
          { id: 7, start: 0.0, end: 1.5, text: "It was really nice.", vi: "Buổi tối rất tuyệt.", context: "Này, Millie. Ừm?" },
          { id: 8, start: 1.6, end: 3.5, text: "Had a lot of sides.", vi: "Có rất nhiều món phụ.", context: "Này, Millie. Ừm?" },
          { id: 9, start: 3.6, end: 6.5, text: "But I don't really eat meat.", vi: "Nhưng tôi không thực sự ăn thịt.", context: "Này, Millie. Ừm?" },
          { id: 10, start: 6.6, end: 8.5, text: "That looks incredible. So, thank you.", vi: "Trông thật tuyệt vời. Cảm ơn anh.", context: "Này, Millie. Ừm?" },
          { id: 11, start: 8.6, end: 12.0, text: "I don't know, but my quiches never turn out.", vi: "Tôi không biết tại sao, nhưng món quiche của tôi chẳng bao giờ được như ý.", context: "Này, Millie. Ừm?" },
          { id: 12, start: 12.1, end: 16.0, text: "I've been meaning to ask you, did you learn how to cook while you were in prison?", vi: "Tôi đã định hỏi bạn, bạn học nấu ăn khi ở trong tù à?", context: "Này, Millie. Ừm?" },
          { id: 13, start: 16.1, end: 19.5, text: "You know she was in prison for 10 years before she came to work for us.", vi: "Bạn biết đấy, cô ấy đã ở tù 10 năm trước khi đến làm việc với chúng tôi.", context: "Này, Millie. Ừm?" },
          { id: 14, start: 19.6, end: 20.8, text: "Right?", vi: "Đúng không?", context: "Này, Millie. Ừm?" }
        ]
      },
      {
        videoId: "qOEcqimJJI8",
        title: "Gigi Hadid Makes Pasta Dinner | Now Serving | Vogue",
        sentences: [
          { id: 1, start: 0.5, end: 4.0, text: "Hi everyone, I'm Gigi Hadid and today I am cooking pasta.", vi: "Chào mọi người, tôi là Gigi Hadid và hôm nay tôi đang nấu mì Ý.", context: "Vogue Video" },
          { id: 2, start: 4.2, end: 8.0, text: "This is one of my favorite dishes to make at home.", vi: "Đây là một trong những món ăn tôi thích làm nhất tại nhà.", context: "Vogue Video" }
        ]
      }
    ];

    let currentVideoIndex = 0;
    let currentSentenceIndex = 0;
    let player = null;
    let syncTimer = null;
    let isLooping = false;
    let isAutoPause = false;
    let isBlur = false;
    let isKaraoke = true;
    let showIPA = true;
    let showVI = true;
    let currentAccent = 'US';
    let fontSizes = ['text-2xl sm:text-3xl lg:text-4xl', 'text-xl sm:text-2xl lg:text-3xl', 'text-3xl sm:text-4xl lg:text-5xl'];
    let currentFontIndex = 0;
    let currentPopupWord = '';

    // ==================== TÍCH HỢP YOUTUBE API ====================
    function onYouTubeIframeAPIReady() {
      loadVideoPlayer(videoPresets[currentVideoIndex].videoId);
    }

    function loadVideoPlayer(videoId) {
      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
        return;
      }
      player = new YT.Player('youtube-player', {
        videoId: videoId,
        playerVars: {
          'playsinline': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': () => {
            renderCurrentSentence();
            renderTranscriptList();
            startSyncLoop();
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('mainPlayIcon');
      if (event.data === YT.PlayerState.PLAYING) {
        playIcon.className = "fa-solid fa-pause text-sm";
      } else {
        playIcon.className = "fa-solid fa-play text-sm";
      }
    }

    // ==================== ĐỒNG BỘ THỜI GIAN THỰC (100MS) ====================
    function startSyncLoop() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(() => {
        if (!player || !player.getCurrentTime) return;
        const currentTime = player.getCurrentTime();
        const sentences = videoPresets[currentVideoIndex].sentences;
        const cur = sentences[currentSentenceIndex];

        if (cur && currentTime >= cur.end) {
          if (isLooping) {
            player.seekTo(cur.start, true);
            return;
          } else if (isAutoPause && player.getPlayerState() === YT.PlayerState.PLAYING) {
            player.pauseVideo();
            return;
          }
        }

        const matchIndex = sentences.findIndex(s => currentTime >= s.start && currentTime <= s.end);
        if (matchIndex !== -1 && matchIndex !== currentSentenceIndex) {
          currentSentenceIndex = matchIndex;
          renderCurrentSentence();
          highlightTranscriptItem();
        }
      }, 100);
    }

    // ==================== HIỂN THỊ PHỤ ĐỀ 3 TẦNG ====================
    function renderCurrentSentence() {
      const sentences = videoPresets[currentVideoIndex].sentences;
      const s = sentences[currentSentenceIndex];
      if (!s) return;

      const subEnglish = document.getElementById('subEnglish');
      const subIPA = document.getElementById('subIPA');
      const subVietnamese = document.getElementById('subVietnamese');
      const subContext = document.getElementById('subContext');

      const words = s.text.split(' ');
      subEnglish.innerHTML = '';
      subIPA.innerHTML = '';

      words.forEach((word) => {
        const cleanWord = word.toLowerCase().replace(/[^a-z']/g, '');
        const ipaText = getAutoIPA(cleanWord);
        const viText = dictionary[cleanWord] ? dictionary[cleanWord].vi : 'từ vựng';

        const spanWord = document.createElement('span');
        spanWord.className = "word-item cursor-pointer hover:text-sky-600 transition px-1 py-0.5 rounded";
        spanWord.innerText = word;
        spanWord.onclick = () => openDict(cleanWord, ipaText, viText);
        subEnglish.appendChild(spanWord);

        const spanIpa = document.createElement('span');
        spanIpa.className = "px-1";
        spanIpa.innerText = ipaText;
        subIPA.appendChild(spanIpa);
      });

      subVietnamese.innerText = s.vi;
      subContext.innerText = s.context ? `"${s.context}"` : '';

      subIPA.style.display = showIPA ? 'flex' : 'none';
      subVietnamese.style.display = showVI ? 'block' : 'none';
    }

    // ==================== DANH SÁCH BẢN GHI PHẢI ====================
    function renderTranscriptList() {
      const listEl = document.getElementById('transcriptList');
      const sentences = videoPresets[currentVideoIndex].sentences;
      document.getElementById('totalSentenceBadge').innerText = `${sentences.length} câu`;

      listEl.innerHTML = '';
      sentences.forEach((s, index) => {
        const item = document.createElement('div');
        item.id = `trans-item-${index}`;
        item.className = `p-3.5 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 ${
          index === currentSentenceIndex 
            ? 'active-sentence-card' 
            : 'bg-white border-slate-200 hover:border-slate-300'
        }`;
        item.onclick = () => jumpToSentence(index);

        item.innerHTML = `
          <div class="flex items-center gap-1.5 pt-0.5 text-xs font-semibold text-slate-400">
            <span class="w-5 text-right font-mono">${s.id}</span>
            <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
          </div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-slate-800 leading-snug">${s.text}</p>
            <p class="text-xs text-slate-500 font-medium mt-1">${s.vi}</p>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function highlightTranscriptItem() {
      const sentences = videoPresets[currentVideoIndex].sentences;
      sentences.forEach((_, idx) => {
        const el = document.getElementById(`trans-item-${idx}`);
        if (!el) return;
        if (idx === currentSentenceIndex) {
          el.className = 'p-3.5 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 active-sentence-card';
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          el.className = 'p-3.5 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 bg-white border-slate-200 hover:border-slate-300';
        }
      });
    }

    // ==================== ĐIỀU KHIỂN & CHẾ ĐỘ ====================
    function togglePlay() {
      if (!player) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function jumpToSentence(index) {
      currentSentenceIndex = index;
      const s = videoPresets[currentVideoIndex].sentences[index];
      if (player && s) {
        player.seekTo(s.start, true);
        player.playVideo();
      }
      renderCurrentSentence();
      highlightTranscriptItem();
    }

    function prevSentence() {
      if (currentSentenceIndex > 0) jumpToSentence(currentSentenceIndex - 1);
    }

    function nextSentence() {
      const sentences = videoPresets[currentVideoIndex].sentences;
      if (currentSentenceIndex < sentences.length - 1) jumpToSentence(currentSentenceIndex + 1);
    }

    function replayCurrent() {
      jumpToSentence(currentSentenceIndex);
    }

    function toggleLoop() {
      isLooping = !isLooping;
      document.getElementById('loopStatus').innerText = isLooping ? 'Bật' : 'Tắt';
      document.getElementById('loopBtn').classList.toggle('text-sky-600', isLooping);
    }

    function toggleAutoPause() {
      isAutoPause = !isAutoPause;
      document.getElementById('autoPauseStatus').innerText = isAutoPause ? 'Bật' : 'Tắt';
      document.getElementById('autoPauseBtn').classList.toggle('text-sky-600', isAutoPause);
    }

    function toggleBlur() {
      isBlur = !isBlur;
      const focusCard = document.getElementById('focusCard');
      const btn = document.getElementById('blurToggleBtn');
      if (isBlur) {
        focusCard.classList.add('blur-mode');
        btn.classList.add('bg-slate-800', 'text-white');
      } else {
        focusCard.classList.remove('blur-mode');
        btn.classList.remove('bg-slate-800', 'text-white');
      }
    }

    function toggleKaraoke() {
      isKaraoke = !isKaraoke;
      document.getElementById('karaokeToggleBtn').classList.toggle('bg-sky-50', isKaraoke);
    }

    function toggleIPA() {
      showIPA = !showIPA;
      document.getElementById('ipaToggleBtn').className = showIPA 
        ? 'px-2.5 py-1.5 rounded-lg border border-sky-300 bg-sky-500 text-white font-bold transition'
        : 'px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-500 font-bold transition';
      document.getElementById('subIPA').style.display = showIPA ? 'flex' : 'none';
    }

    function toggleVI() {
      showVI = !showVI;
      document.getElementById('viToggleBtn').className = showVI 
        ? 'px-2.5 py-1.5 rounded-lg border border-sky-300 bg-sky-500 text-white font-bold transition'
        : 'px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-500 font-bold transition';
      document.getElementById('subVietnamese').style.display = showVI ? 'block' : 'none';
    }

    function cycleFontSize() {
      currentFontIndex = (currentFontIndex + 1) % fontSizes.length;
      document.getElementById('subEnglish').className = `serif-text ${fontSizes[currentFontIndex]} font-semibold text-slate-900 tracking-tight leading-snug flex flex-wrap justify-center gap-x-2 gap-y-1`;
    }

    function toggleAccent() {
      currentAccent = currentAccent === 'US' ? 'UK' : 'US';
      document.getElementById('accentLabel').innerText = currentAccent;
    }

    function setSpeed(rate) {
      if (player && player.setPlaybackRate) {
        player.setPlaybackRate(rate);
        document.getElementById('speedLabel').innerText = rate + 'x';
        document.getElementById('speedMenu').classList.add('hidden');
      }
    }

    function toggleDropdown(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    // ==================== CƠ CHẾ DỊCH TRƯỚC BẰNG GOOGLE TRANSLATE ====================
    async function translateBatchToVietnamese(texts) {
      try {
        const fullText = texts.join('\n');
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(fullText)}`);
        const data = await res.json();
        const translatedFull = data[0].map(item => item[0]).join('');
        return translatedFull.split('\n');
      } catch (err) {
        return texts;
      }
    }

    async function openDict(word, ipa, vi) {
      currentPopupWord = word;
      document.getElementById('dictWord').innerText = word;
      document.getElementById('dictIpa').innerText = ipa;
      document.getElementById('dictMeaning').innerText = 'Đang tra cứu...';
      openModal('dictModal');
      speakWord(word);

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(word)}`);
        const data = await res.json();
        document.getElementById('dictMeaning').innerText = data[0][0][0] || vi;
      } catch(e) {
        document.getElementById('dictMeaning').innerText = vi;
      }
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = currentAccent === 'US' ? 'en-US' : 'en-GB';
        window.speechSynthesis.speak(utter);
      }
    }

    // ==================== TỰ ĐỘNG LẤY PHỤ ĐỀ YOUTUBE QUA PROXY ====================
    async function handleAutoFetchAndTranslate() {
      const url = document.getElementById('customYoutubeUrl').value.trim();
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);

      if (!match || !match[1]) {
        alert("Vui lòng nhập đường link YouTube hợp lệ!");
        return;
      }

      const videoId = match[1];
      showStatus("Đang truy xuất thông tin phụ đề từ YouTube...");

      try {
        // Tải trang YouTube qua Proxy công khai
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}`;
        const res = await fetch(proxyUrl);
        const html = await res.text();

        // Tìm danh sách Caption Tracks trong mã nguồn trang
        const regex = /"captionTracks":\s*(\[.*?\])/;
        const matchCaptions = html.match(regex);

        if (!matchCaptions) {
          throw new Error("Video này không có phụ đề tiếng Anh có sẵn trên YouTube. Mày hãy tải file .srt lên ở ô dự phòng nhé!");
        }

        const captions = JSON.parse(matchCaptions[1]);
        // Ưu tiên phụ đề tiếng Anh
        const enTrack = captions.find(c => c.languageCode === 'en' || c.vssId?.includes('.en')) || captions[0];

        showStatus("Đã tìm thấy phụ đề, đang tải dữ liệu...");
        const trackRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(enTrack.baseUrl)}`);
        const xmlText = await trackRes.text();

        // Bóc tách XML của YouTube timedtext
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const textNodes = xmlDoc.getElementsByTagName("text");

        if (textNodes.length === 0) {
          throw new Error("Không thể bóc tách nội dung phụ đề từ video này.");
        }

        let rawList = [];
        for (let i = 0; i < textNodes.length; i++) {
          const node = textNodes[i];
          const start = parseFloat(node.getAttribute("start") || "0");
          const dur = parseFloat(node.getAttribute("dur") || "3");
          const text = decodeHTMLEntities(node.textContent.trim());
          if (text) {
            rawList.push({ start, end: start + dur, text });
          }
        }

        // Tự động gộp câu tự nhiên (tránh ngắt vụn từng từ)
        let mergedSentences = mergeShortSegments(rawList);

        showStatus(`Đang dịch trước toàn bộ ${mergedSentences.length} câu sang tiếng Việt...`);
        const englishTexts = mergedSentences.map(s => s.text);
        const viTranslations = await translateBatchToVietnamese(englishTexts);

        // Gán bản dịch tiếng Việt vào danh sách câu
        mergedSentences.forEach((s, idx) => {
          s.id = idx + 1;
          s.vi = viTranslations[idx] || s.text;
          s.context = "Phụ đề YouTube tự động";
        });

        // Nạp vào danh sách và chạy video
        videoPresets.push({
          videoId: videoId,
          title: `Video YouTube (${videoId})`,
          sentences: mergedSentences
        });

        hideStatus();
        closeModal('addVideoModal');
        loadPresetVideo(videoPresets.length - 1);

      } catch (err) {
        hideStatus();
        alert(err.message || "Có lỗi khi lấy phụ đề. Hãy thử dùng ô tải file .srt nhé!");
      }
    }

    // ==================== TẢI FILE .SRT TRỰC TIẾP ====================
    async function handleSrtFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const url = document.getElementById('customYoutubeUrl').value.trim();
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      const videoId = match ? match[1] : "LpUh8nUzRL8";

      showStatus("Đang đọc file .srt và dịch sang tiếng Việt...");
      const reader = new FileReader();
      reader.onload = async (e) => {
        const content = e.target.result;
        const parsed = parseSRT(content);

        if (parsed.length === 0) {
          hideStatus();
          alert("File .srt không hợp lệ hoặc không có dữ liệu!");
          return;
        }

        const englishTexts = parsed.map(p => p.text);
        const viTranslations = await translateBatchToVietnamese(englishTexts);

        parsed.forEach((s, idx) => {
          s.id = idx + 1;
          s.vi = viTranslations[idx] || s.text;
          s.context = "File .srt từ máy tính";
        });

        videoPresets.push({
          videoId: videoId,
          title: file.name.replace(/\.[^/.]+$/, ""),
          sentences: parsed
        });

        hideStatus();
        closeModal('addVideoModal');
        loadPresetVideo(videoPresets.length - 1);
      };
      reader.readAsText(file);
    }

    // Bộ giải mã file .SRT chuẩn xác
    function parseSRT(data) {
      const regex = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n|\r?\n$\vert{}$)/g;
      let matches;
      let result = [];

      while ((matches = regex.exec(data)) !== null) {
        const start = srtTimeToSeconds(matches[2]);
        const end = srtTimeToSeconds(matches[3]);
        const text = matches[4].replace(/\r?\n/g, ' ').replace(/<[^>]*>/g, '').trim();
        if (text) {
          result.push({ start, end, text });
        }
      }
      return result;
    }

    function srtTimeToSeconds(timeString) {
      const parts = timeString.replace(',', '.').split(':');
      return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
    }

    // Tự động gộp các đoạn quá ngắn thành câu tự nhiên
    function mergeShortSegments(list) {
      let merged = [];
      let cur = null;

      for (let item of list) {
        if (!cur) {
          cur = { ...item };
        } else {
          const endsWithPunctuation = /[.!?]$/.test(cur.text);
          const duration = item.end - cur.start;

          if (!endsWithPunctuation && duration < 6.0) {
            cur.text += ' ' + item.text;
            cur.end = item.end;
          } else {
            merged.push(cur);
            cur = { ...item };
          }
        }
      }
      if (cur) merged.push(cur);
      return merged;
    }

    function decodeHTMLEntities(str) {
      const doc = new DOMParser().parseFromString(str, 'text/html');
      return doc.body.textContent || "";
    }

    function showStatus(text) {
      document.getElementById('fetchStatusBox').classList.remove('hidden');
      document.getElementById('fetchStatusText').innerText = text;
      document.getElementById('submitVideoBtn').disabled = true;
    }

    function hideStatus() {
      document.getElementById('fetchStatusBox').classList.add('hidden');
      document.getElementById('submitVideoBtn').disabled = false;
    }

    function loadPresetVideo(index) {
      currentVideoIndex = index;
      currentSentenceIndex = 0;
      const video = videoPresets[index];
      document.getElementById('currentVideoBadge').innerText = video.videoId;
      document.getElementById('currentVideoTitle').innerText = video.title;
      loadVideoPlayer(video.videoId);
      renderCurrentSentence();
      renderTranscriptList();
      closeModal('addVideoModal');
    }

    function filterTranscript() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sentences = videoPresets[currentVideoIndex].sentences;
      sentences.forEach((s, idx) => {
        const el = document.getElementById(`trans-item-${idx}`);
        if (!el) return;
        const match = s.text.toLowerCase().includes(query) || s.vi.toLowerCase().includes(query);
        el.style.display = match ? 'flex' : 'none';
      });
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
