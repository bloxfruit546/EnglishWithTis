<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh Qua Video YouTube</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; }
        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin-top: 20px;
        }
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .right-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 500px;
            overflow-y: auto;
        }
        .controls {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button, input[type="file"]::file-selector-button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Tỷ lệ 16:9 */
            height: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .subtitle-line {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }
        .subtitle-line:hover { background-color: #f0f0f0; }
        .subtitle-line.active {
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        .sub-vi {
            font-size: 14px;
            color: #666;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>Học Tiếng Anh Qua Phụ Đề Video</h1>

    <div class="controls">
        <input type="text" id="youtube-url" placeholder="Dán link hoặc kéo thả link video YouTube vào đây...">
        <button onclick="loadVideo()">Tải Video</button>
        <input type="file" id="srt-file" accept=".vtt,.srt" onchange="loadSubtitles(event)">
    </div>

    <div class="container">
        <!-- Khu vực phát video -->
        <div class="left-panel">
            <div class="video-wrapper">
                <div id="player"></div>
            </div>
        </div>

        <!-- Khu vực danh sách phụ đề chạy theo video -->
        <div class="right-panel" id="transcript">
            <p style="color: #999; text-align: center;">Vui lòng tải file phụ đề (.vtt hoặc .srt) để hiển thị lời thoại.</p>
        </div>
    </div>

    <!-- Tải thư viện YouTube Player API -->
    <script src="https://youtube.com"></script>

    <script>
        let player;
        let subtitles = [];
        let intervalId;

        // Khởi tạo trình phát YouTube mặc định (Video mẫu)
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', // ID video mặc định
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Hàm trích xuất ID từ link YouTube bất kỳ
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Tải video mới khi người dùng dán link
        function loadVideo() {
            const url = document.getElementById('youtube-url').value;
            const videoId = getYouTubeId(url);
            if (videoId) {
                player.loadVideoById(videoId);
            } else {
                alert('Đường dẫn YouTube không hợp lệ!');
            }
        }

        // Xử lý kéo thả link vào ô nhập liệu
        const urlInput = document.getElementById('youtube-url');
        urlInput.addEventListener('dragover', (e) => e.preventDefault());
        urlInput.addEventListener('drop', (e) => {
            e.preventDefault();
            const data = e.dataTransfer.getData('text');
            urlInput.value = data;
            loadVideo();
        });

        // Hàm đọc và xử lý file phụ đề (.srt hoặc .vtt)
        function loadSubtitles(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                subtitles = parseSRTorVTT(text);
                renderTranscript();
            };
            reader.readAsText(file);
        }

        // Chuyển đổi định dạng SRT/VTT thành mảng Object dữ liệu dạng giây (seconds)
        function parseSRTorVTT(data) {
            const lines = data.replace(/\r\n/g, '\n').split('\n');
            const result = [];
            let current = null;

            const timeReg = /(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const match = timeReg.exec(line);

                if (match) {
                    const start = parseInt(match[1]) * 3600 + parseInt(match[2]) * 60 + parseInt(match[3]) + parseInt(match[4]) / 1000;
                    const end = parseInt(match[5]) * 3600 + parseInt(match[6]) * 60 + parseInt(match[7]) + parseInt(match[8]) / 1000;
                    current = { start, end, text: [] };
                } else if (line === '' && current) {
                    result.push(current);
                    current = null;
                } else if (current && line !== '') {
                    current.text.push(line);
                }
            }
            if (current) result.push(current);
            return result;
        }

        // Hiển thị danh sách phụ đề lên bảng bên phải
        function renderTranscript() {
            const container = document.getElementById('transcript');
            container.innerHTML = '';

            subtitles.forEach((sub, index) => {
                const div = document.createElement('div');
                div.className = 'subtitle-line';
                div.id = `sub-${index}`;
                
                // Giả định dòng 1 là tiếng Anh, dòng 2 là dịch nghĩa (nếu file có sẵn cả hai)
                const engText = sub.text[0] || '';
                const viText = sub.text.slice(1).join(' ') || '';

                div.innerHTML = `<div class="sub-en">${engText}</div>${viText ? `<div class="sub-vi">\${viText}</div>` : ''}`;
                
                // Click vào câu nào video nhảy ngay đến giây đó với độ trễ bằng 0
                div.onclick = () => {
                    player.seekTo(sub.start, true);
                };
                container.appendChild(div);
            });
        }

        // Theo dõi trạng thái video để cuộn và highlight chữ theo thời gian thực
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                intervalId = setInterval(updateSubtitleHighlight, 100);
            } else {
                clearInterval(intervalId);
            }
        }

        // Thuật toán kiểm tra giây hiện tại và highlight câu phụ đề tương ứng
        function updateSubtitleHighlight() {
            if (!player || !subtitles.length) return;
            const currentTime = player.getCurrentTime();

            subtitles.forEach((sub, index) => {
                const element = document.getElementById(`sub-${index}`);
                if (element) {
                    if (currentTime >= sub.start && currentTime <= sub.end) {
                        if (!element.classList.contains('active')) {
                            // Xóa active cũ
                            document.querySelectorAll('.subtitle-panel .active').forEach(el => el.classList.remove('active'));
                            element.classList.add('active');
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        element.classList.remove('active');
                    }
                }
            });
        }
    </script>
</body>
</html>
